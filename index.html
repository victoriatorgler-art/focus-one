<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b4fe9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Focus One">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Focus One</title>
</head>
<body>
<main id="app">
  <section id="focus" class="screen active">
    <header><div class="eyebrow">FOCUS ONE</div><h1>Focus on one thing.</h1><p>Choose the one activity that deserves your attention now.</p></header>
    <h2>What are you focusing on?</h2>
    <div id="activities" class="grid"></div>
    <button id="addActivity" class="ghost">+ New activity</button>
    <h2>How long?</h2>
    <div id="durations" class="durations"></div>
    <div class="custom"><input id="customMinutes" type="number" min="1" max="240" inputmode="numeric" placeholder="Custom minutes"><button id="useCustom">Use</button></div>
    <button id="start" class="primary">Start focus</button>
    <div id="todayMini" class="mini"></div>
  </section>

  <section id="timer" class="screen">
    <div class="timer-wrap">
      <div id="timerActivity" class="activity-title"></div>
      <div class="ring" style="--p:0"><div class="ring-inner"><div id="time" class="time">25:00</div><div id="statusLine">Stay with this one thing</div></div></div>
      <div class="row"><button id="pause" class="primary small">Pause</button><button id="end" class="danger small">End</button></div>
    </div>
  </section>

  <section id="complete" class="screen complete">
    <div class="check">✓</div><h1>Focus complete</h1><p id="completeText"></p>
    <button id="break" class="primary">Take a 5-minute break</button>
    <button id="repeat" class="secondary">Repeat focus</button><button id="done" class="ghost">Done</button>
  </section>

  <section id="today" class="screen">
    <header><div class="eyebrow">TODAY</div><h1 id="todayTotal">0m focused</h1><p id="todayCount">0 sessions</p></header>
    <div id="sessionList" class="sessions"></div>
    <button id="clearToday" class="ghost">Clear today's history</button>
  </section>
</main>
<nav id="nav"><button data-screen="focus" class="nav-active">Focus</button><button data-screen="today">Today</button></nav>
<div id="modal" class="modal hidden"><div class="card"><h2>New activity</h2><input id="activityName" maxlength="40" placeholder="Activity name"><div class="row"><button id="cancelAdd" class="secondary">Cancel</button><button id="saveAdd" class="primary">Add</button></div></div></div>
<script src="app.js"></script>
</body></html>
