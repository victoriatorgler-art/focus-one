<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#147d79"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css"><title>Focus One</title></head><body><main>
<section id="tasks" class="screen active"><small>FOCUS ONE</small><h1>Know what’s next.</h1><p>Focus on one thing. Finish what matters.</p><button id="add" class="primary">+ Add task</button><div id="next"></div><div id="groups"></div></section>
<section id="setup" class="screen"><button class="link" data-back>‹ Tasks</button><small>FOCUS ON</small><h1 id="setupName"></h1><p id="setupDesc"></p><p id="setupDue"></p><h3>HOW LONG?</h3><div id="durations"></div><div class="custom"><input id="custom" type="number" min="1" max="240" placeholder="Custom minutes"><button id="useCustom">Use</button></div><button id="start" class="primary">Start focus</button></section>
<section id="timer" class="screen center"><small id="timerDue"></small><h2 id="timerName"></h2><p id="timerDesc" class="description"></p><div id="ring" class="ring"><div><b id="clock">25:00</b><span id="message">Stay with this one thing</span></div></div><button id="complete" class="primary">Complete task</button><div class="row"><button id="pause">Pause</button><button id="end" class="danger">End focus</button></div><p id="wake" class="muted tiny">Keeping screen awake while focusing</p></section>
<section id="review" class="screen center"><div class="check">✓</div><h1>Focus session complete</h1><p id="reviewText"></p><h2>Did you complete the task?</h2><button id="markComplete" class="primary">Mark task complete</button><button id="later">Pick it back up later</button></section>
<section id="nextScreen" class="screen center"><small>WHAT’S NEXT?</small><h1>Choose your next focus.</h1><div id="choices"></div><button id="pick">Pick another task</button><button id="break">Take a 5-minute break</button><button id="done" class="link">Done for now</button></section>
<section id="today" class="screen"><small>TODAY</small><h1 id="todayTotal"></h1><p id="todayCount"></p><div id="history"></div><h3>COMPLETED TASKS</h3><div id="completed"></div></section></main>
<nav><button data-nav="tasks">Tasks</button><button data-nav="today">Today</button></nav>
<div id="modal" class="modal hidden"><form id="form"><h2 id="formTitle">Add task</h2><input id="id" type="hidden"><label>Task name<input id="name" required maxlength="80"></label><label>Description <em>(optional)</em><textarea id="description" maxlength="300" placeholder="Add context, notes, or what success looks like"></textarea></label><label>Due type<select id="type"><option value="date">Specific date</option><option value="none">No due date</option><option value="evergreen">Evergreen</option></select></label><label id="dateWrap">Due date<input id="due" type="date"></label><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary">Save</button></div></form></div>
<script src="app.js"></script></body></html>
